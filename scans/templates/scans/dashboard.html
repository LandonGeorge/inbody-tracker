{% extends "base.html" %}
{% block content %}
    <h2>Your Progress</h2>
    <a href="{% url 'upload_scan' %}">Upload New Scan</a>

    <canvas id="progressChart" style="max-width: 900px;"></canvas>

    <script>
        const chartData = {{ chart_data_json|safe }};

        new Chart(document.getElementById('progressChart'), {
            type: 'line',
            data: {
                labels: chartData.labels,
                datasets: [
                    {
                        label: 'Weight (lb)',
                        data: chartData.weight,
                        borderColor: 'rgb(54, 162, 235)',
                        yAxisID: 'y',
                    },
                    {
                        label: 'Muscle Mass (lb)',
                        data: chartData.muscle_mass,
                        borderColor: 'rgb(75, 192, 192)',
                        yAxisID: 'y',
                    },
                    {
                        label: 'Body Fat %',
                        data: chartData.body_fat_pct,
                        borderColor: 'rgb(255, 99, 132)',
                        yAxisID: 'y1',
                    },
                ]
            },
            options: {
                scales: {
                    y: { type: 'linear', position: 'left', title: { display: true, text: 'lb' } },
                    y1: { type: 'linear', position: 'right', title: { display: true, text: '%' }, grid: { drawOnChartArea: false } },
                }
            }
        });
    </script>
{% endblock %}
