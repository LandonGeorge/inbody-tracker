{% extends "base.html" %}

{% block content %}
<h2>Delete this scan?</h2>
<p>Uploaded {{ scan.uploaded_at|date:"M d, Y" }} — this cannot be undone.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>
<a href="{% url 'scan_list' %}">Cancel</a>
{% endblock %}
