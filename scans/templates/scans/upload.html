{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Upload InBody Scans</h2>
<div class="row">
    <div class="col-md-6">
        <form method="post" enctype="multipart/form-data" id="upload-form">
            {% csrf_token %}
            {% include "includes/bootstrap_form.html" %}
            <button type="submit" class="btn btn-primary" id="upload-submit">Upload</button>
        </form>
        <script>
            document.getElementById("upload-form").addEventListener("submit", function () {
                var btn = document.getElementById("upload-submit");
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm" aria-hidden="true"></span> Uploading…';
            });
        </script>
    </div>
</div>
{% endblock %}
