{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title mb-4">Log In</h2>
                <form method="post">
                    {% csrf_token %}
                    {% include "includes/bootstrap_form.html" %}
                    <button type="submit" class="btn btn-primary w-100">Log In</button>
                </form>
                <a href="{% url 'signup' %}" class="d-block text-center mt-3">Need an account? Sign up</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
